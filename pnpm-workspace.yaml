catalogMode: strict
shamefullyHoist: true
shellEmulator: true
trustPolicy: no-downgrade
trustPolicyIgnoreAfter: 1440

packages:
  - packages/*
  - scripts

allowBuilds:
  '@parcel/watcher': true
  esbuild: true
  unrs-resolver: true

catalog:
  '@antfu/eslint-config': ^9.5.1
  '@nuxt/eslint': ^1.17.0
  '@types/node': ^26.6.4
  '@unocss/eslint-config': ^66.10.5
  eslint: ^10.12.0
  eslint-plugin-format: ^2.0.1
  npm-run-all2: ^9.0.3
  typescript: ^6.0.3
  vue: ^3.6.0-rc.10
  vue-tsc: ^3.3.12

catalogs:
  scripts:
    '@node-rs/xxhash': ^1.7.8
    '@sindresorhus/fnv1a': ^3.1.0
    image-size: ^2.0.4
  website:
    '@iconify-json/logos': ^1.2.15
    '@iconify-json/ph': ^1.2.2
    '@nuxt/kit': ^4.6.0
    '@unocss/nuxt': ^66.10.5
    lightningcss: ^1.33.0
    nuxt: ^4.6.0
    unocss: ^66.10.5
    vue-router: ^5.4.0
