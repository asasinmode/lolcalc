name: Deploy to GitHub Pages
on:
  workflow_dispatch:
  push:
    branches:
      - feat/v2
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - uses: pnpm/action-setup@v5
        with:
          package_json_file: packages/website/package.json
          cache_dependency_path: packages/website/pnpm-lock.yaml
      - run: pnpm i --frozen-lockfile
        working-directory: packages/website
      - run: NUXT_APP_BASE_URL=/lolcalc/ pnpx nuxt build --preset github_pages
        working-directory: packages/website
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: packages/website/.output/public
  deploy:
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
