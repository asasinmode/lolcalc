name: Deploy to GitHub Pages
on:
  workflow_dispatch:
  push:
    branches:
      - feat/v2
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install
        working-directory: ./packages/website
      - run: NUXT_APP_BASE_URL=/colector.lol/ bunx nuxt build --preset github_pages
        working-directory: ./packages/website
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./packages/website/.output/public
  deploy:
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
